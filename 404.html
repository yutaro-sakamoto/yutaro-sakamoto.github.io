<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coming soon</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="This site is being rebuilt." />
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfc;
        --text: #16181d;
        --muted: #5c6270;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --text: #e6edf3;
          --muted: #9aa4b2;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Hiragino Sans",
          "Noto Sans JP", Meiryo, sans-serif;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        line-height: 1.8;
        text-align: center;
      }

      h1 {
        font-size: clamp(1.5rem, 5vw, 2rem);
        letter-spacing: -0.02em;
        font-weight: 700;
      }

      p {
        color: var(--muted);
        margin-top: 1rem;
        font-size: 0.9375rem;
      }

      [lang="en"] {
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Coming soon</h1>
      <p>ただいまサイトを作り直しています。しばらくお待ちください。</p>
      <p lang="en">This site is being rebuilt. Please check back later.</p>
    </main>
  </body>
</html>
